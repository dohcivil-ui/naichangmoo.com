const WINDOW = { from: "2569-02-28", to: "2569-09-30" };
const inWindow = (d) => d >= WINDOW.from && d <= WINDOW.to;

const RULEBOOK = {
  standard: {

/** หลักเกณฑ์ที่ 1 — ตัดสินที่ "วันที่ส่งมอบงวดงาน" */
function thresholdRuleFor(period) {
  return inWindow(period.date) ? RULEBOOK.temporary : RULEBOOK.standard;
}

/** หลักเกณฑ์ที่ 2 — ตัดสินที่ "วันที่ลงนามในสัญญา" คนละตัวกับข้อ 1 */

/* ============================================================
   แกนคำนวณ — ทำบนหน่วยหนึ่งในพันเสมอ
   ว 109 ข้อ ค.3 สั่งให้ตัดทศนิยมที่ 3 ตำแหน่ง "โดยไม่มีการปัดเศษ"
   ถ้าคำนวณด้วย float ตรง ๆ 1.045 - 0.04 จะได้ 1.0049999999999999
   แล้วการตัดทิ้งจะกิน 1.005 เหลือ 1.004 — เพี้ยนไปทั้งหลัก
   ============================================================ */
const milli = (x) => Math.trunc(x * 1000);          // ตัดทิ้ง ไม่ปัด
const fromMilli = (m) => m / 1000;
const fmt3 = (m) => (m / 1000).toFixed(3);
const baht = (n) => n.toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const bahtShort = (n) => n.toLocaleString("th-TH");

function computeK(formula) {
  const terms = [{ sym: null, coef: formula.base, ratio: null, milli: milli(formula.base) }];
  let total = milli(formula.base);
  for (const [sym, coef] of Object.entries(formula.t)) {
    const px = INDEX[sym];
    if (!px) { terms.push({ sym, coef, ratio: null, milli: null, missing: true }); continue; }
    const ratioM = milli(px.now / px.base);                    // เลขสัมพันธ์ให้เสร็จก่อน
    const termM = milli(coef * fromMilli(ratioM));             // แล้วจึงคูณสัมประสิทธิ์
    terms.push({ sym, coef, ratio: ratioM, milli: termM, px });
    total += termM;
  }
  return { terms, kMilli: total, complete: terms.every((t) => t.missing !== true) };
}

function settle(kMilli, period) {
  const rule = thresholdRuleFor(period);
  const t = rule.thresholdMilli;
  const amount = period.amount;
  const drift = kMilli - 1000;

  if (Math.abs(drift) <= t) {
    return { rule, action: "none", adjMilli: 1000, pay: amount, delta: 0, drift };
  }
  const adjMilli = drift > 0 ? kMilli - t : kMilli + t;
  const pay = Math.round(amount * fromMilli(adjMilli) * 100) / 100;
  return {
    rule, drift, adjMilli, pay,
    action: drift > 0 ? "add" : "recover",
    delta: Math.round((pay - amount) * 100) / 100
  };
}

/** ส่วนต่างที่จะได้ถ้าใช้อีกหลักเกณฑ์หนึ่ง — ใช้เทียบให้ผู้ใช้เห็นว่าเลือกผิดแล้วต่างแค่ไหน */
function counterfactual(kMilli, period) {
  const applied = thresholdRuleFor(period);
  const other = applied.id === "temp2569" ? RULEBOOK.standard : RULEBOOK.temporary;
  const drift = kMilli - 1000;
  if (Math.abs(drift) <= other.thresholdMilli) return { other, delta: 0 };
  const adj = drift > 0 ? kMilli - other.thresholdMilli : kMilli + other.thresholdMilli;
  const pay = Math.round(period.amount * fromMilli(adj) * 100) / 100;
  return { other, delta: Math.round((pay - period.amount) * 100) / 100 };
}

function currentFormula() { return FORMULAS.find((f) => f.id === state.formulaId); }
function currentPeriod() { return PERIODS.find((p) => p.state === "งวดปัจจุบัน"); }

/* ---------- ผู้ช่วย: เดาสูตรจากคำอธิบายงานเป็นภาษาคน ---------- */
function matchFormula(text) {
  const q = text.trim();
  if (!q) return null;
  let best = null;
  for (const f of FORMULAS) {
    let score = 0;
    for (const tag of f.tags) if (q.includes(tag)) score += 3;
    for (const word of f.name.split(/[\s/—-]+/)) if (word.length > 2 && q.includes(word)) score += 1;
    if (score > 0 && (!best || score > best.score)) best = { f, score };
  }
  return best;
}

function renderAide() {
  const g = aideFor(state.step);
  const fast = state.mode === "fast";
  let html = "";

  html += '<div class="aide__top">' + ICONS.aide +
    '<div><b>ผู้ช่วยจับมือทำ</b><small>ขั้นที่ ' + state.step + " · " + esc(STEPS[state.step - 1].label) + "</small></div></div>";

  html += '<div class="aide__modes">' +
    '<button type="button" data-mode="hand" aria-pressed="' + (!fast) + '">จับมือทำ</button>' +
    '<button type="button" data-mode="fast" aria-pressed="' + fast + '">ทางลัด</button></div>';

  html += '<div class="aide__body">';

  if (!fast) {
    html += "<div><h3>" + esc(g.title) + "</h3><p>" + esc(g.body) + "</p></div>";
  }

  if (g.ask) {
    html += '<div class="ask">' +
      '<textarea id="ask" placeholder="เช่น ก่อสร้างอาคารที่พักอาศัย 7 ชั้น สำหรับข้าราชการ">' + esc(state.askText) + "</textarea>" +
      '<button type="button" id="ask-go">หาสูตรที่ตรงกับงานนี้</button></div>';

    if (state.suggestion) {
      const s = state.suggestion;
      if (s.f) {
        html += '<div class="suggest"><b>ผมคิดว่าเป็นสูตรนี้</b>' +
          "<strong>" + esc(s.f.id) + " · " + esc(s.f.name) + "</strong>" +
          "<p>หมวดที่ " + (s.f.g + 1) + " " + esc(GROUPS[s.f.g]) + " · ความมั่นใจ " + (s.score >= 3 ? "สูง" : "ปานกลาง") + "</p>";
        if (state.showWhy) {
          html += '<p style="margin-top:.5rem">ผมจับคำว่า <em>' + esc(s.hit) + "</em> ในคำอธิบายของคุณ ซึ่งตรงกับขอบเขตของหมวดนี้ใน ว 109 หน้า 2 " +
            "สูตรนี้ให้น้ำหนักวัสดุก่อสร้าง 0.40 ซึ่งเป็นสัดส่วนที่สูงที่สุดในบรรดา 34 สูตร เหมาะกับงานที่ค่าวัสดุเป็นก้อนใหญ่ของค่างาน</p>";
        }
        html += '<div class="row"><button type="button" class="use" data-use="' + esc(s.f.id) + '">ใช้สูตรนี้</button>' +
          '<button type="button" class="why" id="why">' + (state.showWhy ? "ซ่อนเหตุผล" : "ทำไมถึงแนะนำ") + "</button></div></div>";
      } else {
        html += '<div class="suggest"><b>ยังจับไม่ได้</b><p>ผมยังแยกไม่ออกจากคำอธิบายนี้ ลองบอกเพิ่มว่าเป็นงานอาคาร งานทาง งานดิน งานชลประทาน หรืองานวางท่อ — ' +
          "ผมจะไม่เดาให้ เพราะเลือกสูตรผิดคือค่า K ผิดทั้งสัญญา</p></div>";
      }
    }
  }

  if (g.trap && !fast) {
    html += '<div class="trap"><b>' + esc(g.trap.b) + "</b><p>" + g.trap.p + "</p></div>";
  }

  if (g.checks) {
    html += '<div><h3 style="margin-bottom:.5rem">ผมตรวจให้แล้ว</h3><ul class="checks">';
    for (const c of g.checks) {
      html += '<li><span class="' + c.s + '">' + ICONS[c.s] + "</span><span>" + c.t + "</span></li>";
    }
    html += "</ul></div>";
  }

  if (g.recall && !fast) {
    html += '<div class="recall"><b>' + esc(g.recall.b) + "</b><p>" + g.recall.p + "</p></div>";
  }

  html += "</div>";

  html += '<div class="boundary"><b>ขอบเขตของผม</b> — ผมอธิบาย ตรวจ และเสนอสูตรให้ได้ ' +
    "แต่ตัวเลขค่า K และเงินชดเชยมาจากสูตรใน ว 109 ที่ระบบคำนวณตรง ๆ ไม่ได้มาจากผม " +
    "และผมแก้ข้อมูลในสัญญาของคุณเองไม่ได้ ทุกครั้งที่ผมเสนอ คุณเป็นคนกดยืนยัน</div>";

  return html;
}

/* ============================================================ */
function renderPanel() {
  const f = currentFormula();
  const p = currentPeriod();
  const k = computeK(f);
  const st = settle(k.kMilli, p);
  const bm = baseMonthRule();

  let chip = '<span class="pill">' + ICONS.ok + " ข้อมูลครบ</span>";
  if (state.step === 2 && !state.reviewed) chip = '<span class="pill pill--bad">' + ICONS.bad + " หมวดยังไม่รับรอง</span>";
  else if (state.step === 3 && !state.api) chip = '<span class="pill pill--warn">' + ICONS.warn + " กรอกมือ</span>";
  else if (state.step === 7 && !state.canPrint) chip = '<span class="pill pill--warn">' + ICONS.warn + " พิมพ์ไม่ได้ตามสิทธิ์</span>";

  let body = "";

  if (state.step === 1) {
    body += '<div class="fields">' +
      field("เลขที่สัญญา", CONTRACT.no) +
      field("หน่วยงานผู้ว่าจ้าง", CONTRACT.owner) +
      '<label class="field field--wide"><span>ชื่องานตามสัญญา</span><input value="' + esc(CONTRACT.name) + '"></label>' +
      field("วงเงินตามสัญญา (บาท)", baht(CONTRACT.value)) +
      field("เดือนที่เห็นชอบราคากลาง", CONTRACT.medianApproved) +
      field("เดือนที่เปิดซองประกวดราคา", CONTRACT.bidOpened) +
      '<label class="field field--key"><span>วันที่ลงนามในสัญญา <em>ตัวตัดสินเดือนฐาน</em></span><input value="' + esc(CONTRACT.signedLabel) + '"></label>' +
      field("ส่งมอบงานงวดสุดท้าย", CONTRACT.lastDelivery) +
      "</div>";

    body += '<div style="margin-top:1.3rem;border:1px solid ' + (bm.temporary ? "#cfc4ee" : "#bedbd7") +
      ';border-radius:13px;padding:1.1rem 1.2rem;background:' + (bm.temporary ? "#f7f5fd" : "linear-gradient(135deg,#eff9f7,#f8fcfc)") + '">' +
      '<div style="color:' + (bm.temporary ? "#4b3d86" : "#0b7777") + ';font-size:.66rem;font-weight:900;letter-spacing:.12em">เดือนฐานที่ระบบจะใช้</div>' +
      '<h3 style="margin:.35rem 0;color:#093d4b;font-size:1.15rem">' + esc(bm.month) + "</h3>" +
      '<p style="max-width:64ch;margin:0;color:#688087;font-size:.83rem;line-height:1.6">' +
      "เพราะสัญญาลงนาม <b>" + esc(CONTRACT.signedLabel) + "</b> ซึ่ง" +
      (bm.temporary
        ? "อยู่ในช่วง 28 ก.พ. – 30 ก.ย. 2569 จึงเข้าหลักเกณฑ์ที่ 2 ของมาตรการชั่วคราว ให้ใช้<b>เดือนที่เห็นชอบราคากลาง</b>แทนเดือนเปิดซอง"
        : "อยู่<b>นอก</b>ช่วง 28 ก.พ. – 30 ก.ย. 2569 จึงยังใช้หลักเกณฑ์เดิมของ ว 109 คือ<b>เดือนที่เปิดซองประกวดราคา</b>") +
      "</p></div>";

    body += '<div class="note"><b>สองหลักเกณฑ์ของมาตรการชั่วคราวใช้วันคนละตัว</b> — หลักเกณฑ์ที่ 1 (เกณฑ์ ± 2%) ตัดสินที่<b>วันที่ส่งมอบงวดงาน</b> ส่วนหลักเกณฑ์ที่ 2 (เดือนฐาน) ตัดสินที่<b>วันที่ลงนามในสัญญา</b> สัญญาเดียวจึงเข้าข้อหนึ่งแต่ไม่เข้าอีกข้อได้ · สิทธิ์เรียกร้องเงินเพิ่มมีอายุ <b>90 วัน</b> นับจากวันส่งมอบงานงวดสุดท้าย</div>';
  }

  if (state.step === 2) {
    body += '<div class="groupbar">';
    GROUPS.forEach((name, i) => {
      body += '<button type="button" data-group="' + i + '" aria-pressed="' + (state.group === i) + '">' + esc(name) + "</button>";
    });
    body += "</div>";

    body += '<div class="picker">';
    for (const item of FORMULAS.filter((x) => x.g === state.group)) {
      const on = item.id === state.formulaId;
      body += '<button type="button" class="pick" data-pick="' + esc(item.id) + '" aria-pressed="' + on + '">' +
        "<code>" + esc(item.id) + "</code><span>" + esc(item.name) +
        (item.only ? ' <small style="color:#a5500b">เฉพาะ ' + esc(item.only) + "</small>" : "") +
        '</span><small>' + Object.keys(item.t).length + " พจน์</small></button>";
    }
    body += "</div>";

    body += '<div class="formula"><code>K = ' + fmt3(milli(f.base)).replace(/0$/, "") +
      Object.entries(f.t).map(([s, c]) => " + " + c.toFixed(2) + " " + s + "t/" + s + "o").join("") + "</code></div>";

    body += '<div class="cards">';
    for (const [sym, coef] of Object.entries(f.t)) {
      body += '<div class="card"><span>' + esc(sym) + "t / " + esc(sym) + "o · น้ำหนัก " + coef.toFixed(2) + "</span>" +
        '<strong style="font-size:.92rem;letter-spacing:0">' + esc(VARS[sym].label) + "</strong>" +
        (VARS[sym].note ? "<small>" + esc(VARS[sym].note) + "</small>" : "") + "</div>";
    }
    body += "</div>";

    if (!state.reviewed) {
      body += '<div class="note" style="border-left-color:#8a3b3b;background:#f9e7e7;color:#8a3b3b"><b style="color:#8a3b3b">หมวดนี้ยังไม่ผ่านการรับรอง</b> — การถอดสูตรจาก ว 109 ยังไม่มีวิศวกรลงชื่อตรวจเทียบเอกสารต้นฉบับ เลือกใช้คำนวณไม่ได้จนกว่าจะมีผู้รับรอง</div>';
    }
  }

  if (state.step === 3) {
    body += state.api
      ? '<div class="note" style="border-left-color:#17604e;background:#e4f4f0;color:#17604e"><b>ดัชนีชุดนี้เป็นของจริง</b> ดึงจาก index-api.tpso.go.th ฐานปี 2530 เมื่อ ' + INDEX_FETCHED + ' เดือนล่าสุดที่ สนค. เผยแพร่คือ ' + INDEX_LATEST + ' ทุกค่าบันทึกรหัสดัชนีและเวลาที่ดึงไว้ในใบรายการคำนวณ</div>'
      : '<div class="note">การดึงอัตโนมัติถูกปิดอยู่ ทุกค่าต้องกรอกเองพร้อมระบุที่มา ระบบจะพิมพ์คำว่า <b>กรอกมือ</b> กำกับไว้ในใบรายการคำนวณทุกบรรทัด</div>';

    body += '<div class="tablewrap"><table><thead><tr><th>ตัวแปร</th><th>ดัชนีที่ใช้</th>' +
      '<th class="n">ฐาน ก.ย. 68</th><th class="n">ส่งมอบ มิ.ย. 69</th><th class="n">เลขสัมพันธ์</th><th>ที่มา</th></tr></thead><tbody>';
    for (const sym of Object.keys(f.t)) {
      const px = INDEX[sym];
      if (!px) {
        body += '<tr><td style="color:#0b7777;font-weight:900">' + esc(sym) + "</td><td>" + esc(VARS[sym].label) +
          '</td><td class="n" colspan="3" style="color:#8a3b3b;text-align:center">ยังไม่มีชุดข้อมูลของตัวแปรนี้</td><td>—</td></tr>';
        continue;
      }
      body += "<tr><td style='color:#0b7777;font-weight:900'>" + esc(sym) + "</td><td>" + esc(VARS[sym].label) +
        '</td><td class="n">' + px.base.toFixed(1) + '</td><td class="n">' + px.now.toFixed(1) +
        '</td><td class="n">' + fmt3(milli(px.now / px.base)) + "</td><td style='color:#799096;font-size:.75rem'>" +
        (state.api ? "กระทรวงพาณิชย์" : "กรอกมือ") + "</td></tr>";
    }
    body += "</tbody></table></div>";
    body += '<div class="note"><b>It/Io คือดัชนีราคาผู้บริโภคทั่วไป</b> ไม่ใช่ดัชนีวัสดุก่อสร้าง และ <b>Mt/Mo ไม่รวมเหล็กและซีเมนต์</b> ตามตารางนิยามหน้า 9 ของ ว 109 · แก้ค่าเองได้ แต่ต้องบันทึกเหตุผลกำกับทุกครั้ง</div>';
  }

  if (state.step === 4) {
    const sum = PERIODS.reduce((a, b) => a + b.amount, 0);
    body += '<div class="tablewrap"><table><thead><tr><th>งวด</th><th>รายการงาน</th>' +
      '<th class="n">ค่างานตามสัญญา</th><th>เดือนส่งมอบ</th><th>สถานะ</th></tr></thead><tbody>';
    for (const w of PERIODS) {
      const tone = w.state === "คำนวณแล้ว" ? "background:#d6eee8;color:#17604e"
        : w.state === "งวดปัจจุบัน" ? "background:#fff0e3;color:#955012" : "background:#eef3f3;color:#68818a";
      body += '<tr class="' + (w.state === "งวดปัจจุบัน" ? "is-current" : "") + '"><td class="num" style="font-weight:700">' + w.n +
        "</td><td>" + esc(w.name) + '</td><td class="n">' + baht(w.amount) + "</td><td>" + esc(w.month) +
        '</td><td><span style="border-radius:999px;padding:3px 9px;font-size:.68rem;font-weight:800;' + tone + '">' + esc(w.state) + "</span></td></tr>";
    }
    body += '<tr><td></td><td style="font-weight:700;color:#123e4e">รวมทั้งสัญญา</td><td class="n">' + baht(sum) +
      '</td><td colspan="2" style="color:#17604e;font-size:.78rem;font-weight:700">' +
      (sum === CONTRACT.value ? "ตรงกับวงเงินตามสัญญา" : "ไม่ตรงกับวงเงินตามสัญญา") + "</td></tr>";
    body += "</tbody></table></div>";
    body += '<div class="note">ถ้างานล่าช้าโดยเป็นความผิดของผู้รับจ้าง ให้ใช้ค่า K ของ<b>เดือนสุดท้ายตามอายุสัญญา</b> หรือ<b>เดือนที่ส่งมอบจริง</b> แล้วแต่ตัวใดจะน้อยกว่า</div>';
  }

  if (state.step === 5) {
    body += '<p style="margin:1.2rem 0 .2rem;color:#49606b;font-size:.9rem;line-height:1.7">ว 109 กำหนดให้ทำ<b>เลขสัมพันธ์ให้เป็นผลสำเร็จก่อน</b> แล้วจึงนำไปคูณสัมประสิทธิ์ และให้ใช้ทศนิยม 3 ตำแหน่งทุกขั้นตอน <b>โดยไม่มีการปัดเศษ</b></p>';
    body += '<div class="terms">';
    for (const t of k.terms) {
      if (t.sym === null) {
        body += '<div class="term"><b>' + t.coef.toFixed(2) + "</b><span>ส่วนคงที่ของสูตร " + esc(f.id) + "</span><u></u><em>" + fmt3(t.milli) + "</em></div>";
      } else if (t.missing) {
        body += '<div class="term"><b>' + t.coef.toFixed(2) + "</b><span>" + esc(VARS[t.sym].label) +
          '</span><u style="color:#8a3b3b">ยังไม่มีชุดข้อมูล</u><em style="color:#8a3b3b">—</em></div>';
      } else {
        body += '<div class="term"><b>' + t.coef.toFixed(2) + "</b><span>" + esc(VARS[t.sym].label) + "</span><u>" +
          t.px.now.toFixed(1) + " / " + t.px.base.toFixed(1) + " = " + fmt3(t.ratio) + "</u><em>" + fmt3(t.milli) + "</em></div>";
      }
    }
    body += '<div class="term term--total"><span>ESCALATION FACTOR K</span><em>' + fmt3(k.kMilli) + "</em></div></div>";
  }

  if (state.step === 6) {
    const drift = st.drift;
    const t = st.rule.thresholdMilli;
    const over = Math.abs(drift) > t;
    const temp = st.rule.id === "temp2569";
    const cf = counterfactual(k.kMilli, p);

    body += '<div style="margin:1.3rem 0 1rem;border:1px solid ' + (temp ? "#cfc4ee" : "#bedbd7") +
      ';border-radius:13px;padding:1.15rem;background:' + (temp ? "#f7f5fd" : "linear-gradient(135deg,#eff9f7,#f8fcfc)") + '">' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
      '<span style="color:' + (temp ? "#4b3d86" : "#0b7777") + ';font-size:.66rem;font-weight:900;letter-spacing:.12em">' +
      esc(st.rule.label) + "</span>" +
      (st.rule.verified
        ? ""
        : '<span class="pill pill--warn" style="font-size:.63rem">' + ICONS.warn + " ยังไม่ได้ตรวจกับเอกสารต้นฉบับ</span>") +
      "</div>" +
      '<h3 class="num" style="margin:.4rem 0;color:#093d4b;font-size:1.05rem">| ' + fmt3(k.kMilli) + " − 1.000 | = " + fmt3(Math.abs(drift)) +
      (over ? " มากกว่า " + fmt3(t) + " จึงปรับ" + (drift > 0 ? "เพิ่ม" : "ลด") + "ค่างาน" : " ไม่เกิน " + fmt3(t) + " จึงไม่ปรับค่างาน") + "</h3>" +
      '<p style="max-width:66ch;margin:0;color:#688087;font-size:.82rem;line-height:1.6">' +
      (temp
        ? "งวดนี้ส่งมอบ <b>" + esc(p.month) + "</b> ซึ่งอยู่ในช่วง 28 ก.พ. – 30 ก.ย. 2569 จึงเข้าหลักเกณฑ์ที่ 1 ของมาตรการชั่วคราว ใช้เกณฑ์ <b>± 2%</b> แทน ± 4% ตามปกติ"
        : "งวดนี้ส่งมอบ <b>" + esc(p.month) + "</b> ซึ่งอยู่นอกช่วงมาตรการชั่วคราว จึงใช้เกณฑ์ <b>± 4%</b> ตาม ว 109 ตามปกติ") +
      " · นำ<b>เฉพาะส่วนที่เกินเกณฑ์</b>มาคำนวณ ไม่คิดส่วนแรกให้</p>" +
      '<p style="margin:.5rem 0 0;color:#8794a0;font-size:.75rem">ที่มา ' + esc(st.rule.source) + "</p></div>";

    body += '<div class="cards">' +
      card("ค่างานงวดที่ " + p.n, baht(p.amount), "ราคาตามสัญญา Po") +
      card("ค่า K หลังหักเกณฑ์", fmt3(st.adjMilli), fmt3(k.kMilli) + " − " + fmt3(t)) +
      card("ค่างานที่ต้องจ่าย", baht(st.pay), "P = Po × K") +
      "</div>";

    body += '<div class="verdict"><div><h3>' +
      (st.action === "add" ? "เงินเพิ่มงวดที่ " + p.n : st.action === "recover" ? "เรียกคืนงวดที่ " + p.n : "ไม่มีการปรับงวดที่ " + p.n) +
      "</h3><p>" + baht(p.amount) + " × " + fmt3(st.adjMilli) + " = " + baht(st.pay) +
      " บาท ส่วนต่างจากค่างานตามสัญญาคือเงินชดเชย</p></div>" +
      '<div class="verdict__amount">' + (st.delta > 0 ? "+" : "") + baht(st.delta) + "</div></div>";

    if (cf.delta !== st.delta) {
      const gap = Math.abs(st.delta - cf.delta);
      body += '<div class="note" style="border-left-color:#4b3d86;background:#f7f5fd;color:#5f5a7d">' +
        "<b style='color:#4b3d86'>ถ้าใช้" + esc(cf.other.label) + "แทน</b> งวดนี้จะได้ <b class='num'>" + baht(cf.delta) +
        "</b> บาท ต่างจากที่ถูกต้อง <b class='num'>" + baht(gap) + "</b> บาท ในงวดเดียว — " +
        "นี่คือเหตุผลที่ระบบตัดสินเกณฑ์จากวันที่ส่งมอบให้อัตโนมัติ แทนที่จะให้คนจำเอง</div>";
    }
  }

  if (state.step === 7) {
    body += '<div class="sheet"><small>ตัวอย่างหัวกระดาษ</small>' +
      "<h3>รายการคำนวณค่า K ตามสัญญาแบบปรับราคาได้</h3>" +
      "<p>สัญญาเลขที่ " + esc(CONTRACT.no) + " · หมวดที่ " + (f.g + 1) + " " + esc(GROUPS[f.g]) + " สูตร " + esc(f.id) +
      " · เดือนฐาน " + esc(bm.month) + " · งวดที่ " + p.n + " ส่งมอบ " + esc(p.month) + "<br>" +
      "อ้างอิงมติคณะรัฐมนตรี ตามหนังสือสำนักเลขาธิการคณะรัฐมนตรี ที่ นร 0203/ว 109 ลงวันที่ 24 สิงหาคม 2532</p></div>";

    body += '<div class="footrow"><div><b>' +
      (state.canPrint ? "พิมพ์ได้ทั้งฉบับ ครบทุกขั้นตอน" : "สิทธิ์ระหว่างทดลองใช้งานยังพิมพ์ไม่ได้") + "</b><p>" +
      (state.canPrint
        ? "ใบรายการคำนวณพิมพ์ครบทั้ง 7 ขั้นตอน ไม่ใช่เฉพาะแท็บที่เปิดอยู่ พร้อมที่มาของดัชนีทุกค่า ส่งออกเป็น PDF เท่านั้น ไม่มีการส่งออกเป็นไฟล์ Word"
        : "คำนวณและตรวจผลบนจอได้ทั้งหมด แต่การพิมพ์และการส่งออกถูกปิดไว้ตามสิทธิ์ที่ได้รับ") + "</p></div>" +
      '<button class="btn btn--orange" ' + (state.canPrint ? "" : "disabled") + ">พิมพ์ หรือ บันทึกเป็น PDF</button></div>";
  }

  const prev = state.step > 1 ? '<button class="btn btn--ghost" data-go="' + (state.step - 1) + '">ย้อนกลับ</button>' : "<span></span>";
  const next = state.step < 7 ? '<button class="btn btn--ink" data-go="' + (state.step + 1) + '">ไปขั้นต่อไป · ' + esc(STEPS[state.step].label) + "</button>" : "<span></span>";

  return '<div class="panel__head"><div><small>ขั้นที่ ' + state.step + " จาก 7</small><h2>" +
    esc(STEPS[state.step - 1].label) + "</h2></div>" + chip + "</div>" + body +
    '<div class="footrow" style="justify-content:space-between">' + prev + next + "</div>";
}

function field(label, value) {
  return '<label class="field"><span>' + esc(label) + '</span><input value="' + esc(value) + '"></label>';
}
function card(label, value, note) {
  return '<div class="card"><span>' + esc(label) + "</span><strong>" + esc(value) + "</strong><small>" + esc(note) + "</small></div>";
}

function render() {
  const f = currentFormula();
  const p = currentPeriod();

  if (!state.open) {
    el("app").innerHTML =
      '<div style="padding:4rem 0 5rem;text-align:center">' +
      '<div class="pill pill--warn" style="margin-bottom:1rem">' + ICONS.clock + " กำลังเตรียมระบบ</div>" +
      '<h1 style="font-size:clamp(2rem,4vw,3.2rem);letter-spacing:-.045em;color:#083a50;max-width:16ch;margin:0 auto 1rem">คำนวณหา Escalation factor (K)</h1>' +
      '<p style="max-width:58ch;margin:0 auto;color:#49606b;line-height:1.75">แอปนี้ถูกประกาศไว้แล้วแต่ผู้ดูแลยังไม่เปิดใช้งาน หน้าทำงานจึงยังไม่เปิด ' +
      "สถานะนี้มาจากทะเบียนแอปที่ผู้ดูแลแพลตฟอร์มประกาศไว้ ไม่ใช่จากบรรทัดในโค้ด</p>" +
      '<p style="max-width:58ch;margin:1rem auto 0;color:#70858b;font-size:.85rem;line-height:1.7">' +
      "นี่เป็นคำแถลงเรื่อง<b>ความพร้อม</b> ไม่ใช่ด่านอนุญาต หน้าจึงอธิบายว่าเกิดอะไรขึ้นแทนที่จะปฏิเสธเฉย ๆ " +
      "ด่านจริงยังอยู่ที่สิทธิ์การใช้งานของแต่ละองค์กร และไม่ได้ย้ายมาที่นี่</p></div>";
    return;
  }

  let html = '<div class="contract"><div>' +
    '<div class="eyebrow">สัญญาแบบปรับราคาได้ · มติ ครม. ว 109 &nbsp;<span class="demo-tag">ดัชนีจริงจาก สนค. · สัญญาเป็นตัวอย่าง</span></div>' +
    "<h1>" + esc(CONTRACT.name) + "</h1>" +
    '<p class="contract__meta"><span>สัญญาเลขที่ <b>' + esc(CONTRACT.no) + "</b></span>" +
    "<span>เดือนฐาน <b>" + esc(baseMonthRule().month) + "</b></span>" +
    '<span>วงเงิน <b class="num">' + baht(CONTRACT.value) + "</b> บาท</span></p></div>" +
    '<div class="gauge"><span>ขั้นตอน</span><strong class="num">' + state.step + " / 7</strong><small>" +
    esc(STEPS[state.step - 1].short) + "</small></div></div>";

  const bmr0 = baseMonthRule();
  const tempPeriods = PERIODS.filter((w) => inWindow(w.date)).length;
  html += '<div style="display:flex;flex-wrap:wrap;gap:.7rem 1.4rem;align-items:center;margin-top:1.2rem;border:1px solid #cfc4ee;border-left:4px solid #4b3d86;border-radius:12px;padding:.85rem 1.05rem;background:#f7f5fd">' +
    '<div style="flex:1 1 320px;min-width:0">' +
    '<b style="color:#4b3d86;font-size:.83rem">มาตรการชั่วคราวปี 2569 มีผลกับสัญญานี้</b>' +
    '<p style="margin:.2rem 0 0;color:#5f5a7d;font-size:.79rem;line-height:1.55">' +
    "เกณฑ์ส่วนต่างลดเหลือ <b>± 2%</b> สำหรับงวดที่ส่งมอบ 28 ก.พ. – 30 ก.ย. 2569 — สัญญานี้เข้าเงื่อนไข <b>" + tempPeriods + " จาก " + PERIODS.length + " งวด</b> · " +
    "ส่วนเดือนฐานตัดสินที่วันลงนามสัญญา ซึ่งสัญญานี้<b>" + (bmr0.temporary ? "เข้า" : "ไม่เข้า") + "</b>เงื่อนไข</p></div>" +
    '<span class="pill pill--warn" style="font-size:.68rem">' + ICONS.warn + " ต้นฉบับยังไม่อยู่ใน km/</span></div>";

  html += '<div class="steps">';
  for (const s of STEPS) {
    html += '<button class="step' + (s.n < state.step ? " is-done" : "") + '" data-go="' + s.n + '"' +
      (s.n === state.step ? ' aria-current="step"' : "") + '><span class="step__n">' + s.n + "</span>" +
      "<b>" + esc(s.label) + "</b><i>" + esc(s.hint) + "</i></button>";
  }
  html += "</div>";

  html += '<div class="board"><section class="panel">' + renderPanel() + "</section>" +
    '<aside class="aide">' + renderAide() + "</aside></div>";

  el("app").innerHTML = html;
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]");
  if (go) { state.step = Number(go.dataset.go); state.suggestion = null; state.showWhy = false; render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }

  const grp = e.target.closest("[data-group]");
  if (grp) { state.group = Number(grp.dataset.group); render(); return; }

  const pick = e.target.closest("[data-pick]");
  if (pick) { state.formulaId = pick.dataset.pick; render(); return; }

  const use = e.target.closest("[data-use]");
  if (use) {
    state.formulaId = use.dataset.use;
    state.group = currentFormula().g;
    state.suggestion = null;
    render();
    return;
  }

  const mode = e.target.closest("[data-mode]");
  if (mode) { state.mode = mode.dataset.mode; render(); return; }

  if (e.target.id === "why") { state.showWhy = !state.showWhy; render(); return; }

  if (e.target.id === "ask-go") {
    const box = el("ask");
    state.askText = box ? box.value : "";
    const m = matchFormula(state.askText);
    if (m) {
      const hit = m.f.tags.find((t) => state.askText.includes(t)) || m.f.name.split(/\s+/)[0];
      state.suggestion = { f: m.f, score: m.score, hit };
    } else {
      state.suggestion = { f: null };
    }
    state.showWhy = false;
    render();
  }
});

for (const [id, key] of [["sw-open", "open"], ["sw-review", "reviewed"], ["sw-api", "api"], ["sw-print", "canPrint"]]) {
  el(id).addEventListener("change", (e) => { state[key] = e.target.checked; render(); });
}

render();
</script>
