name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - initial-project/nextjs-foundation
      - initial-project/nextjs-scaffold
      # Feature branches are where the work actually happens. Without this the
      # gate only runs once a pull request exists, so a branch can carry many
      # commits with nothing checking them.
      - feature/**

permissions:
  contents: read

jobs:
  validate:
    name: Lint, test, typecheck, build and security
    runs-on: ubuntu-latest
    env:
      DEPLOY_TARGET: vercel
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      # PostgreSQL 16 matches the production target recorded in ADR 0002 and
      # docs/architecture/ARCHITECTURE.md. Pinned by digest for the same reason
      # the actions below are.
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: naichangmoo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Enable pnpm from the committed package manager version
        run: corepack enable && corepack prepare pnpm@10.20.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: |
          env -u DATABASE_URL -u BETTER_AUTH_SECRET -u BETTER_AUTH_URL -u NEXT_PUBLIC_AUTH_ENABLED pnpm lint
          env -u DATABASE_URL -u BETTER_AUTH_SECRET -u BETTER_AUTH_URL -u NEXT_PUBLIC_AUTH_ENABLED pnpm test
          env -u DATABASE_URL -u BETTER_AUTH_SECRET -u BETTER_AUTH_URL -u NEXT_PUBLIC_AUTH_ENABLED pnpm typecheck
          env -u DATABASE_URL -u BETTER_AUTH_SECRET -u BETTER_AUTH_URL -u NEXT_PUBLIC_AUTH_ENABLED NODE_ENV=production pnpm build
          pnpm security:check
          node scripts/check-roadmap.mjs
          git diff --check

      # The suites above run with no database on purpose: nothing in lint, build
      # or the unit tests may depend on one. The suites below are the ones the
      # handoff notes have been claiming as verification while CI skipped them.
      - name: Apply migrations to the service database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/naichangmoo_test
        run: pnpm db:migrate

      - name: Run the opt-in database suites
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/naichangmoo_test
          ESTIMETR_DB_TESTS: "1"
        run: pnpm test
